# cargo-mutants config — Phase 2 mutation gate
#
# Plan: ../thoughts/2026-05-23-test-suite-triage.md (Phase 2 section)
# Pre-Phase-2 architecture review remediation (Deviations §7).
#
# Tool version pinned: cargo-mutants 25.3.1 (see Makefile `mutants-install`).
# Install with: `cargo install cargo-mutants --version 25.3.1 --locked`.
#
# Every mutant runs the FULL test suite (no per-binary scoping). Cross-
# cutting suites (`differential_oracle`, `public_conformance_corpus`,
# `semantic_invariants`, `fel_proptest`) catch parser/evaluator/convert
# mutations that scoped runs would have missed as false-positive survivors.
#
# Tractability via parallelism: `--jobs N` in the Makefile runs N mutants
# concurrently, each in its own scratch tree. Mutation runs infrequently
# (weekly CI / manual baseline); time-cost is acceptable for correctness.

# Use nextest if available; falls back to cargo test otherwise.
# Nextest is materially faster on this suite.
test_tool = "cargo"

# Build / test timing.
#
# --minimum-test-timeout 30: floor for auto-tuning; below this proptest
#   flakes show up as timeouts.
# --timeout-multiplier 3: relative to base test time. A mutant that
#   triggers a pathological code path may legitimately take 3x.
minimum_test_timeout = 30
timeout_multiplier = 3.0

# Skip mutating call sites where the call result is discarded or the
# function is a defensive guard. `with_capacity` is the cargo-mutants
# default; the rest are stack-local additions that produce equivalent
# mutants in fel-core.
#
# Add to this list when triaging surviving mutants — equivalent mutants
# (e.g. arithmetic identities like `x + 0 ↔ x`) get annotated here with
# a one-line justification.
skip_calls = [
  "with_capacity",
  "Default::default",  # constructor identity is equivalent, not a test gap
]

# Lower proptest case count to keep mutation runtime tractable. Each mutant
# reruns the proptest binaries; 256 (default) × ~1000 mutants would dominate
# total runtime. 64 cases per mutant is enough to detect mutation-killing
# inputs without exploding wall-clock.
#
# Determinism: proptest reads `PROPTEST_RNG_SEED` if set. The CI workflow
# pins a seed; locally, runs are non-deterministic but the baseline.jsonl
# is generated by CI not locally.
additional_cargo_test_args = []

# NOTE: Per-file test scoping is NOT expressible in mutants.toml. It's
# applied via Makefile targets that invoke cargo-mutants with explicit
# `-- --test <name>` filters. See `make mutants-*` targets.
