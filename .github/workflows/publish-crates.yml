name: Publish crates

# Publishes fel-core to crates.io through crates.io Trusted Publishing (OIDC; no long-lived token in the
# repository): the crate's settings on crates.io name this repository and this workflow file, and
# rust-lang/crates-io-auth-action exchanges the job's identity token for a short-lived publish token.
#
# Runs on a `v*` tag or by hand. It publishes only when Cargo.toml's version is not on crates.io yet,
# so re-running a tag is safe.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Formspec-Labs/fel-core'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package (the same gate as CI)
        run: make package
      - name: Decide whether this version is new
        id: version
        run: |
          local=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fel-core") | .version')
          published=$(curl -sf -A "fel-core publish workflow (github.com/Formspec-Labs/fel-core)" https://crates.io/api/v1/crates/fel-core/versions | jq -r '[.versions[].num] | index("'"$local"'") != null')
          echo "local=$local" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "fel-core $local — already on crates.io: $published"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.version.outputs.published == 'false'
        id: auth
      - name: Publish
        if: steps.version.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
