# Phase 3 lib.rs re-export coverage manifest.
#
# Each [[entries]] table represents one public re-export from `src/lib.rs`.
# The companion gate test (`tests/lib_reexport_coverage_gate.rs`) enumerates
# every `pub use` symbol in `src/lib.rs` and asserts:
#
#   1. Every symbol has a manifest entry.
#   2. Each `proptests = [...]` cite (`tests/file.rs::fn_name`) resolves to a
#      real test function.
#   3. Each `exempt` value is one of E1..E8 (per design §Exemption categories).
#   4. `exempt = "E3" | "E4" | "E5"` entries carry the required
#      `consumer_proptests = [...]` citation (E5 additionally requires
#      `example_tests = ["file.rs:Lstart-Lend"]`).
#
# See `thoughts/2026-05-23-phase-3-ci-gate-design.md` for the full design,
# the audited symbol table, and the exemption-category taxonomy (E1..E8).
#
# audited_at_sha pins the `src/lib.rs` snapshot the audit table was prepared
# against; audited_against_lib_rs_lines pins the byte range of the audited
# `pub use` block. Drift detection: if `src/lib.rs` changes inside this
# range, the gate's enumeration-vs-manifest equality check fails.

audited_at_sha = "ce224d8"
audited_against_lib_rs_lines = "35-78"

